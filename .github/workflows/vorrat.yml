# Ziel im Repo black-weeks-jurasol: .github/workflows/vorrat.yml
# Braucht das Repository-Secret GAMBIO (Inhalt wie die lokale Gambio-Zugangsdatei), legt Andreas selbst an.
name: Vorrat Black Weeks

on:
  schedule:
    - cron: "*/15 6-22 * * *"   # alle 15 Minuten, 7 bis 23 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vorrat
  cancel-in-progress: false

jobs:
  vorrat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Stufen berechnen
        env:
          GAMBIO: ${{ secrets.GAMBIO }}
        run: |
          set -a
          eval "$(printf '%s\n' "$GAMBIO" | grep -E '^GAMBIO_[A-Z_]+=' )"
          set +a
          python vorrat/vorrat.py vorrat.json
      - name: Speichern, wenn sich etwas geändert hat
        run: |
          if [ -n "$(git status --porcelain vorrat.json)" ]; then
            git config user.name "vorrat-bot"
            git config user.email "vorrat-bot@users.noreply.github.com"
            git add vorrat.json
            git commit -m "Vorrat aktualisiert"
            git push
          fi
